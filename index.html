<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#163a2f">
  <title>ניהול שעות עובדים</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap');

    :root {
      --page: #f4f7f5;
      --surface: #ffffff;
      --surface-soft: #f8faf9;
      --ink: #17211d;
      --muted: #68756f;
      --subtle: #93a09a;
      --line: #dfe7e3;
      --brand: #176b52;
      --brand-dark: #10513e;
      --brand-soft: #e7f3ee;
      --danger: #c23d43;
      --danger-soft: #fff0f1;
      --warning: #a36a0a;
      --warning-soft: #fff7e5;
      --shadow-sm: 0 1px 3px rgba(18, 54, 43, .07);
      --shadow: 0 14px 40px rgba(18, 54, 43, .09);
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 100% 0, rgba(23, 107, 82, .08), transparent 32rem),
        var(--page);
      font-family: "Heebo", Arial, sans-serif;
      direction: rtl;
    }

    button, select, input { font: inherit; }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid rgba(23, 107, 82, .2);
      outline-offset: 2px;
    }

    .app-header {
      color: #fff;
      background: linear-gradient(120deg, #102d25 0%, #176b52 58%, #208368 100%);
      box-shadow: 0 8px 30px rgba(16, 81, 62, .18);
    }

    .header-inner {
      width: min(1540px, calc(100% - 40px));
      min-height: 116px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand { display: flex; align-items: center; gap: 15px; }

    .brand-mark {
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
    }

    .brand-mark svg { width: 27px; height: 27px; }
    .brand h1 { margin: 0; font-size: clamp(1.35rem, 2vw, 1.8rem); line-height: 1.2; letter-spacing: -.02em; }
    .brand p { margin: 5px 0 0; color: rgba(255,255,255,.7); font-size: .88rem; }

    .save-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      color: rgba(255,255,255,.84);
      background: rgba(0,0,0,.12);
      font-size: .8rem;
      white-space: nowrap;
    }

    .save-dot { width: 8px; height: 8px; border-radius: 50%; background: #83e6bd; box-shadow: 0 0 0 4px rgba(131,230,189,.12); }

    main { width: min(1540px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 52px; }

    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 22px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow-sm);
    }

    .period-fields, .quick-fill, .field-row { display: flex; align-items: flex-end; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label { color: var(--muted); font-size: .76rem; font-weight: 700; }

    .control {
      height: 43px;
      min-width: 130px;
      padding: 0 13px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      transition: border-color .15s, box-shadow .15s;
    }

    .control:hover { border-color: #bac9c2; }
    .control:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); outline: 0; }

    .btn {
      height: 43px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, background .15s, border-color .15s;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { color: #fff; background: var(--brand); box-shadow: 0 5px 14px rgba(23,107,82,.2); }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-secondary { color: var(--ink); background: var(--surface); border-color: var(--line); }
    .btn-secondary:hover { border-color: #b9c8c1; background: var(--surface-soft); }
    .btn-danger { color: var(--danger); background: var(--surface); border-color: #efd0d2; }
    .btn-danger:hover { background: var(--danger-soft); }

    .quick-fill {
      padding-right: 22px;
      border-right: 1px solid var(--line);
    }

    .quick-fill .control { min-width: 118px; direction: ltr; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 18px 0;
    }

    .stat-card {
      min-height: 106px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      color: var(--brand);
      border-radius: 12px;
      background: var(--brand-soft);
    }

    .stat-icon svg { width: 21px; height: 21px; }
    .stat-label { color: var(--muted); font-size: .78rem; font-weight: 600; }
    .stat-value { margin-top: 2px; font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
    .stat-value small { color: var(--muted); font-size: .72rem; font-weight: 600; }

    .sheet {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .sheet-heading {
      min-height: 72px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    .sheet-title h2 { margin: 0; font-size: 1.05rem; }
    .sheet-title p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; }
    .sheet-actions { display: flex; gap: 9px; }

    .table-wrap { overflow: auto; max-height: calc(100vh - 185px); scrollbar-color: #b9c6c0 transparent; }

    table { width: 100%; min-width: 1360px; border-collapse: separate; border-spacing: 0; font-size: .79rem; }

    th, td { border-left: 1px solid #edf1ef; border-bottom: 1px solid #edf1ef; text-align: center; }

    thead th {
      height: 62px;
      padding: 7px 6px;
      position: sticky;
      top: 0;
      z-index: 6;
      color: var(--muted);
      background: #f7faf8;
      box-shadow: 0 1px 0 var(--line);
      font-weight: 700;
      white-space: nowrap;
    }

    th.employee-col, td.employee-col {
      position: sticky;
      right: 0;
      z-index: 5;
      width: 144px;
      min-width: 144px;
      padding: 0 17px;
      text-align: right;
      background: var(--surface);
      box-shadow: -4px 0 10px rgba(24, 48, 39, .04);
    }

    thead th.employee-col { z-index: 10; background: #f7faf8; }

    th.total-col, td.total-col {
      position: sticky;
      left: 0;
      z-index: 5;
      width: 102px;
      min-width: 102px;
      background: #f5faf7;
      box-shadow: 4px 0 10px rgba(24, 48, 39, .04);
    }

    thead th.total-col { z-index: 10; }
    tbody tr:hover td { background-color: #fbfdfc; }
    tbody tr:hover td.employee-col { background: #f8fcfa; }
    tbody td { height: 128px; padding: 8px 6px; background: var(--surface); }
    .employee-name { font-size: .9rem; font-weight: 800; }
    .employee-sub { margin-top: 3px; color: var(--subtle); font-size: .68rem; font-weight: 500; }

    .day-header { min-width: 100px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .day-header strong { color: var(--ink); font-size: .92rem; }
    .day-header span { font-size: .66rem; font-weight: 600; }
    .day-header em { min-height: 13px; color: inherit; font-size: .57rem; font-style: normal; font-weight: 700; }
    th.closed-day { color: var(--muted); background: #eef2f0; }
    th.closed-day .day-header strong { color: var(--muted); }
    th.short-day { color: var(--warning); background: var(--warning-soft); }
    th.short-day .day-header strong { color: var(--warning); }
    td.closed-day { background: #f3f5f4; }
    td.short-day { background: #fffdf8; }
    tbody tr:hover td.closed-day { background: #eef2f0; }
    .closed-cell {
      min-width: 98px;
      min-height: 86px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--subtle);
      font-size: .68rem;
      font-weight: 700;
    }
    .closed-cell svg { width: 20px; height: 20px; }

    .time-cell { min-width: 98px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
    .time-input-row { display: grid; grid-template-columns: 27px 1fr; align-items: center; gap: 4px; }
    .time-input-row label { color: var(--subtle); font-size: .62rem; font-weight: 600; text-align: right; }
    .time-input {
      width: 100%;
      height: 29px;
      padding: 0 3px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      font-size: .74rem;
      font-weight: 600;
      text-align: center;
      direction: ltr;
    }
    .time-input:focus { border-color: var(--brand); outline: 0; box-shadow: 0 0 0 2px var(--brand-soft); }

    .hours-display {
      height: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand);
      border-radius: 6px;
      background: var(--brand-soft);
      font-size: .68rem;
      font-weight: 800;
    }

    .hours-display.empty { color: var(--subtle); background: var(--surface-soft); font-weight: 600; }

    .off-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: var(--subtle); cursor: pointer; font-size: .61rem; user-select: none; }
    .off-toggle input { width: 13px; height: 13px; margin: 0; accent-color: var(--danger); }
    .time-cell.is-off .time-input { opacity: .38; pointer-events: none; }
    .time-cell.is-off .hours-display { color: var(--danger); background: var(--danger-soft); }

    .total-number { color: var(--brand-dark); font-size: .92rem; font-weight: 800; }
    .total-number.empty { color: var(--subtle); }

    tfoot td {
      height: 50px;
      position: sticky;
      bottom: 0;
      z-index: 7;
      color: var(--brand-dark);
      background: #edf7f2;
      border-top: 1px solid #cfe6dc;
      font-weight: 800;
    }

    tfoot td.employee-col { z-index: 9; background: #e5f3ed; }
    tfoot td.total-col { z-index: 9; background: #dcefe7; }

    .empty-state { padding: 80px 20px; text-align: center; color: var(--muted); }
    .empty-state svg { width: 44px; height: 44px; color: var(--brand); }
    .empty-state h3 { margin: 14px 0 5px; color: var(--ink); }
    .empty-state p { margin: 0; font-size: .86rem; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 100;
      max-width: min(360px, calc(100% - 48px));
      padding: 12px 16px;
      color: #fff;
      border-radius: 12px;
      background: #17211d;
      box-shadow: 0 10px 34px rgba(0,0,0,.22);
      font-size: .84rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1050px) {
      .toolbar { align-items: stretch; flex-direction: column; }
      .quick-fill { padding: 18px 0 0; border-right: 0; border-top: 1px solid var(--line); }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 650px) {
      .header-inner, main { width: min(100% - 24px, 1540px); }
      .header-inner { min-height: 96px; }
      .brand p, .save-status { display: none; }
      main { padding-top: 14px; }
      .toolbar { padding: 14px; }
      .period-fields, .quick-fill { align-items: stretch; flex-wrap: wrap; }
      .field { flex: 1 1 120px; }
      .control { width: 100%; min-width: 0; }
      .quick-fill .field { flex: 1 1 44%; }
      .quick-fill .btn { flex: 1 1 100%; }
      .stats { gap: 9px; margin: 12px 0; }
      .stat-card { min-height: 88px; padding: 12px; gap: 10px; }
      .stat-icon { width: 36px; height: 36px; flex-basis: 36px; }
      .stat-value { font-size: 1.1rem; }
      .sheet { border-radius: var(--radius); }
      .sheet-heading { align-items: flex-start; flex-direction: column; }
      .sheet-actions { width: 100%; }
      .sheet-actions .btn { flex: 1; padding: 0 10px; }
      .table-wrap { max-height: calc(100vh - 120px); }
      .toast { right: 12px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.4v5l3.2 2"></path><path d="M8.8 2.7h6.4"></path>
          </svg>
        </div>
        <div>
          <h1>ניהול שעות עובדים</h1>
          <p>מעקב חודשי, חישוב אוטומטי וייצוא מסודר לשכר</p>
        </div>
      </div>
      <div class="save-status" id="saveStatus"><span class="save-dot"></span><span>הנתונים נשמרים אוטומטית</span></div>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="בחירת תקופה ופעולות מהירות">
      <div class="period-fields">
        <div class="field">
          <label for="selMonth">חודש עבודה</label>
          <select id="selMonth" class="control">
            <option value="1">ינואר</option><option value="2">פברואר</option><option value="3">מרץ</option>
            <option value="4">אפריל</option><option value="5">מאי</option><option value="6">יוני</option>
            <option value="7">יולי</option><option value="8">אוגוסט</option><option value="9">ספטמבר</option>
            <option value="10">אוקטובר</option><option value="11">נובמבר</option><option value="12">דצמבר</option>
          </select>
        </div>
        <div class="field">
          <label for="selYear">שנה</label>
          <select id="selYear" class="control"></select>
        </div>
      </div>

      <div class="quick-fill">
        <div class="field">
          <label for="quickStart">כניסה קבועה</label>
          <input id="quickStart" class="control" type="time" value="07:00" step="900">
        </div>
        <div class="field">
          <label for="quickEnd">יציאה קבועה</label>
          <input id="quickEnd" class="control" type="time" value="19:00" step="900">
        </div>
        <button class="btn btn-secondary" type="button" onclick="fillEmptyWorkdays()" title="ממלא ימים פתוחים בלבד; ביום שישי היציאה תהיה ב־17:00">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          מלא ימי עבודה ריקים
        </button>
      </div>
    </section>

    <section class="stats" aria-label="סיכום חודשי">
      <article class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
        <div><div class="stat-label">עובדים פעילים</div><div class="stat-value" id="statEmployees">0</div></div>
      </article>
      <article class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></div>
        <div><div class="stat-label">משמרות שהוזנו</div><div class="stat-value" id="statShifts">0</div></div>
      </article>
      <article class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></div>
        <div><div class="stat-label">סך שעות בחודש</div><div class="stat-value" id="statHours">0:00 <small>שעות</small></div></div>
      </article>
      <article class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"></path></svg></div>
        <div><div class="stat-label">ממוצע למשמרת</div><div class="stat-value" id="statAverage">0:00 <small>שעות</small></div></div>
      </article>
    </section>

    <section class="sheet">
      <div class="sheet-heading">
        <div class="sheet-title">
          <h2 id="periodTitle">דוח שעות חודשי</h2>
          <p>השינויים נשמרים במכשיר הזה באופן אוטומטי</p>
        </div>
        <div class="sheet-actions">
          <button class="btn btn-danger" type="button" onclick="clearMonth()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6"></path></svg>
            נקה חודש
          </button>
          <button class="btn btn-primary" type="button" onclick="exportExcel()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M12 12v6M9 15l3 3 3-3"></path></svg>
            ייצוא ל־Excel
          </button>
        </div>
      </div>
      <div id="tableArea"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const EMPLOYEES = ['סמי', 'רמי', 'אבראהים', 'מוחמד', 'ראזי', 'מוסטאפה', 'אדם', 'מרים'];
    const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
    const DAY_NAMES_SHORT = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
    const MONTH_NAMES = ['', 'ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
    const STORAGE_PREFIX = 'restaurant-hours-v2';
    let state = {};
    let currentPeriod = null;
    let saveTimer = null;
    let toastTimer = null;

    const icons = {
      empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18M8 14h3M8 17h7"></path></svg>'
    };

    const now = new Date();
    const yearSelect = document.getElementById('selYear');
    for (let year = 2025; year <= 2035; year++) {
      yearSelect.add(new Option(String(year), String(year), false, year === now.getFullYear()));
    }
    document.getElementById('selMonth').value = String(now.getMonth() + 1);
    document.getElementById('statEmployees').textContent = EMPLOYEES.length;

    document.getElementById('selMonth').addEventListener('change', buildTable);
    document.getElementById('selYear').addEventListener('change', buildTable);

    function daysInMonth(month, year) {
      return new Date(year, month, 0).getDate();
    }

    function employeeId(name) {
      return name.replace(/[^א-תa-z0-9]/gi, '_');
    }

    function storageKey(month, year) {
      return `${STORAGE_PREFIX}:${year}-${String(month).padStart(2, '0')}`;
    }

    function cellKey(employee, day) {
      return `${employeeId(employee)}:${day}`;
    }

    function getDayOfWeek(day) {
      if (!currentPeriod) return null;
      return new Date(currentPeriod.year, currentPeriod.month - 1, day).getDay();
    }

    function isRestaurantClosed(day) {
      return getDayOfWeek(day) === 0;
    }

    function isShortFriday(day) {
      return getDayOfWeek(day) === 5;
    }

    function parseTime(value) {
      if (!value || !/^\d{2}:\d{2}$/.test(value)) return null;
      const [hours, minutes] = value.split(':').map(Number);
      if (hours > 23 || minutes > 59) return null;
      return hours + minutes / 60;
    }

    function calculateHours(start, end) {
      const startValue = parseTime(start);
      const endValue = parseTime(end);
      if (startValue === null || endValue === null) return null;
      let duration = endValue - startValue;
      if (duration < 0) duration += 24;
      return duration;
    }

    function calculateEntryHours(day, start, end) {
      if (isRestaurantClosed(day)) return null;
      if (isShortFriday(day) && start && end && (start >= '17:00' || end > '17:00' || end < start)) return null;
      return calculateHours(start, end);
    }

    function formatHours(value) {
      if (value === null || value === undefined || !Number.isFinite(value)) return '—';
      const totalMinutes = Math.round(value * 60);
      return `${Math.floor(totalMinutes / 60)}:${String(totalMinutes % 60).padStart(2, '0')}`;
    }

    function loadState(month, year) {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey(month, year)) || '{}');
        return saved && typeof saved === 'object' ? saved : {};
      } catch (error) {
        showToast('לא ניתן היה לקרוא את הנתונים השמורים');
        return {};
      }
    }

    function persistState() {
      if (!currentPeriod) return;
      const status = document.querySelector('#saveStatus span:last-child');
      status.textContent = 'שומר שינויים…';
      clearTimeout(saveTimer);
      try {
        localStorage.setItem(storageKey(currentPeriod.month, currentPeriod.year), JSON.stringify(state));
        saveTimer = setTimeout(() => {
          status.textContent = 'כל השינויים נשמרו';
        }, 180);
      } catch (error) {
        status.textContent = 'השמירה נכשלה';
        showToast('השמירה האוטומטית נכשלה במכשיר זה');
      }
    }

    function buildTable() {
      const month = Number(document.getElementById('selMonth').value);
      const year = Number(document.getElementById('selYear').value);
      const days = daysInMonth(month, year);
      currentPeriod = { month, year, days };
      state = loadState(month, year);
      let stateWasNormalized = false;
      document.getElementById('periodTitle').textContent = `${MONTH_NAMES[month]} ${year} · דוח שעות`;

      let header = '<th class="employee-col" scope="col">עובד</th>';
      for (let day = 1; day <= days; day++) {
        const dayOfWeek = new Date(year, month - 1, day).getDay();
        const dayClass = dayOfWeek === 0 ? 'closed-day' : (dayOfWeek === 5 ? 'short-day' : '');
        const dayNote = dayOfWeek === 0 ? 'סגור' : (dayOfWeek === 5 ? 'עד 17:00' : '');
        header += `<th scope="col" class="${dayClass}"><div class="day-header"><strong>${day}</strong><span>${DAY_NAMES_SHORT[dayOfWeek]}</span><em>${dayNote}</em></div></th>`;
      }
      header += '<th class="total-col" scope="col">סה״כ</th>';

      let body = '';
      EMPLOYEES.forEach((employee, index) => {
        const employeeKey = employeeId(employee);
        body += `<tr><td class="employee-col"><div class="employee-name">${employee}</div><div class="employee-sub">עובד ${index + 1}</div></td>`;
        for (let day = 1; day <= days; day++) {
          const dayOfWeek = new Date(year, month - 1, day).getDay();
          const key = cellKey(employee, day);
          if (dayOfWeek === 0) {
            if (state[key]) {
              delete state[key];
              stateWasNormalized = true;
            }
            body += `<td class="closed-day"><div class="closed-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l16 16M7 7.5V5h10v12.5M5 10h14M8 21h8"></path></svg><span>המסעדה סגורה</span></div></td>`;
            continue;
          }
          const saved = { ...(state[key] || {}) };
          if (dayOfWeek === 5 && saved.end > '17:00') {
            saved.end = '17:00';
            state[key] = saved;
            stateWasNormalized = true;
          }
          const off = Boolean(saved.off);
          const fridayLimits = dayOfWeek === 5 ? ' max="17:00"' : '';
          body += `<td class="${dayOfWeek === 5 ? 'short-day' : ''}">
            <div class="time-cell${off ? ' is-off' : ''}" id="cell_${employeeKey}_${day}">
              <div class="time-input-row"><label for="start_${employeeKey}_${day}">כנ׳</label><input class="time-input" id="start_${employeeKey}_${day}" type="time" step="900" value="${saved.start || ''}"${fridayLimits} onchange="updateEntry('${employeeKey}', ${day})"></div>
              <div class="time-input-row"><label for="end_${employeeKey}_${day}">יצ׳</label><input class="time-input" id="end_${employeeKey}_${day}" type="time" step="900" value="${saved.end || ''}"${fridayLimits} onchange="updateEntry('${employeeKey}', ${day})"></div>
              <div class="hours-display empty" id="hours_${employeeKey}_${day}">טרם הוזן</div>
              <label class="off-toggle"><input id="off_${employeeKey}_${day}" type="checkbox" ${off ? 'checked' : ''} onchange="updateEntry('${employeeKey}', ${day})"><span>לא עבד</span></label>
            </div>
          </td>`;
        }
        body += `<td class="total-col"><span class="total-number empty" id="employeeTotal_${employeeKey}">—</span></td></tr>`;
      });

      let footer = '<tr><td class="employee-col">סה״כ יומי</td>';
      for (let day = 1; day <= days; day++) footer += `<td id="dayTotal_${day}">${new Date(year, month - 1, day).getDay() === 0 ? 'סגור' : '—'}</td>`;
      footer += '<td class="total-col" id="grandTotal">—</td></tr>';

      document.getElementById('tableArea').innerHTML = `<div class="table-wrap"><table aria-label="טבלת שעות עובדים לחודש ${MONTH_NAMES[month]} ${year}"><thead><tr>${header}</tr></thead><tbody>${body}</tbody><tfoot>${footer}</tfoot></table></div>`;
      recalculateAll();
      if (stateWasNormalized) persistState();
    }

    function employeeNameFromId(id) {
      return EMPLOYEES.find(name => employeeId(name) === id);
    }

    function updateEntry(employeeKey, day, skipSave = false) {
      const employee = employeeNameFromId(employeeKey);
      if (!employee || isRestaurantClosed(day)) return;
      const start = document.getElementById(`start_${employeeKey}_${day}`).value;
      const endInput = document.getElementById(`end_${employeeKey}_${day}`);
      if (isShortFriday(day) && endInput.value > '17:00') {
        endInput.value = '17:00';
        showToast('ביום שישי שעת היציאה מוגבלת ל־17:00');
      }
      const end = endInput.value;
      const off = document.getElementById(`off_${employeeKey}_${day}`).checked;
      const key = cellKey(employee, day);

      if (!start && !end && !off) delete state[key];
      else state[key] = { start, end, off };

      renderCell(employeeKey, day);
      recalculateAll();
      if (!skipSave) persistState();
    }

    function renderCell(employeeKey, day) {
      const start = document.getElementById(`start_${employeeKey}_${day}`).value;
      const end = document.getElementById(`end_${employeeKey}_${day}`).value;
      const off = document.getElementById(`off_${employeeKey}_${day}`).checked;
      const cell = document.getElementById(`cell_${employeeKey}_${day}`);
      const display = document.getElementById(`hours_${employeeKey}_${day}`);
      cell.classList.toggle('is-off', off);

      if (off) {
        display.textContent = 'לא עבד';
        display.classList.remove('empty');
        return;
      }

      const hours = calculateEntryHours(day, start, end);
      if (hours === null) {
        display.textContent = start && end ? 'שעה לא תקינה' : (start || end ? 'חסרה שעה' : 'טרם הוזן');
        display.classList.add('empty');
      } else {
        display.textContent = formatHours(hours);
        display.classList.remove('empty');
      }
    }

    function getEntryHours(employee, day) {
      if (isRestaurantClosed(day)) return null;
      const entry = state[cellKey(employee, day)];
      if (!entry || entry.off) return null;
      return calculateEntryHours(day, entry.start, entry.end);
    }

    function recalculateAll() {
      if (!currentPeriod) return;
      const { days } = currentPeriod;
      let grandTotal = 0;
      let shifts = 0;

      EMPLOYEES.forEach(employee => {
        const employeeKey = employeeId(employee);
        let employeeTotal = 0;
        for (let day = 1; day <= days; day++) {
          if (isRestaurantClosed(day)) continue;
          renderCell(employeeKey, day);
          const hours = getEntryHours(employee, day);
          if (hours !== null) {
            employeeTotal += hours;
            shifts++;
          }
        }
        grandTotal += employeeTotal;
        const element = document.getElementById(`employeeTotal_${employeeKey}`);
        element.textContent = employeeTotal ? formatHours(employeeTotal) : '—';
        element.classList.toggle('empty', !employeeTotal);
      });

      for (let day = 1; day <= days; day++) {
        if (isRestaurantClosed(day)) {
          document.getElementById(`dayTotal_${day}`).textContent = 'סגור';
          continue;
        }
        let dayTotal = 0;
        EMPLOYEES.forEach(employee => { dayTotal += getEntryHours(employee, day) || 0; });
        document.getElementById(`dayTotal_${day}`).textContent = dayTotal ? formatHours(dayTotal) : '—';
      }

      document.getElementById('grandTotal').textContent = grandTotal ? formatHours(grandTotal) : '—';
      document.getElementById('statShifts').textContent = shifts;
      document.getElementById('statHours').innerHTML = `${formatHours(grandTotal)} <small>שעות</small>`;
      document.getElementById('statAverage').innerHTML = `${formatHours(shifts ? grandTotal / shifts : 0)} <small>שעות</small>`;
    }

    function fillEmptyWorkdays() {
      if (!currentPeriod) return;
      const start = document.getElementById('quickStart').value;
      const end = document.getElementById('quickEnd').value;
      if (!start || !end) {
        showToast('יש לבחור שעת כניסה ושעת יציאה');
        return;
      }

      let filled = 0;
      EMPLOYEES.forEach(employee => {
        for (let day = 1; day <= currentPeriod.days; day++) {
          const dayOfWeek = new Date(currentPeriod.year, currentPeriod.month - 1, day).getDay();
          const key = cellKey(employee, day);
          if (dayOfWeek !== 0 && !state[key]) {
            state[key] = { start, end: dayOfWeek === 5 ? '17:00' : end, off: false };
            filled++;
          }
        }
      });
      renderStateIntoTable();
      persistState();
      showToast(filled ? `נוספו ${filled} משמרות; ימי שישי הוגבלו עד 17:00` : 'אין ימי עבודה ריקים למילוי');
    }

    function renderStateIntoTable() {
      if (!currentPeriod) return;
      EMPLOYEES.forEach(employee => {
        const employeeKey = employeeId(employee);
        for (let day = 1; day <= currentPeriod.days; day++) {
          if (isRestaurantClosed(day)) continue;
          const entry = state[cellKey(employee, day)] || {};
          document.getElementById(`start_${employeeKey}_${day}`).value = entry.start || '';
          document.getElementById(`end_${employeeKey}_${day}`).value = entry.end || '';
          document.getElementById(`off_${employeeKey}_${day}`).checked = Boolean(entry.off);
        }
      });
      recalculateAll();
    }

    function clearMonth() {
      if (!currentPeriod || !Object.keys(state).length) {
        showToast('החודש כבר ריק');
        return;
      }
      if (!window.confirm(`למחוק את כל נתוני ${MONTH_NAMES[currentPeriod.month]} ${currentPeriod.year}? לא ניתן לבטל פעולה זו.`)) return;
      state = {};
      localStorage.removeItem(storageKey(currentPeriod.month, currentPeriod.year));
      buildTable();
      showToast('נתוני החודש נמחקו');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function exportExcel() {
      if (!currentPeriod) return;
      if (typeof XLSX === 'undefined') {
        showToast('רכיב הייצוא לא נטען. יש לבדוק את החיבור לאינטרנט.');
        return;
      }

      const { month, year, days } = currentPeriod;
      const detailedRows = [['שם עובד', 'תאריך', 'יום', 'שעת כניסה', 'שעת יציאה', 'סטטוס', 'שעות עבודה']];
      const summaryRows = [['שם עובד', 'מספר משמרות', 'סך שעות חודשי']];
      let overallHours = 0;
      let overallShifts = 0;

      EMPLOYEES.forEach(employee => {
        let employeeHours = 0;
        let employeeShifts = 0;
        for (let day = 1; day <= days; day++) {
          const entry = state[cellKey(employee, day)] || {};
          const dayOfWeek = new Date(year, month - 1, day).getDay();
          const restaurantClosed = dayOfWeek === 0;
          const hours = restaurantClosed || entry.off ? null : calculateEntryHours(day, entry.start, entry.end);
          if (hours !== null) {
            employeeHours += hours;
            employeeShifts++;
          }
          const date = `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}/${year}`;
          detailedRows.push([
            employee,
            date,
            DAY_NAMES[dayOfWeek],
            restaurantClosed || entry.off ? '' : (entry.start || ''),
            restaurantClosed || entry.off ? '' : (entry.end || ''),
            restaurantClosed ? 'המסעדה סגורה' : (entry.off ? 'לא עבד' : (hours !== null ? 'עבד' : '')),
            hours !== null ? formatHours(hours) : ''
          ]);
        }
        overallHours += employeeHours;
        overallShifts += employeeShifts;
        summaryRows.push([employee, employeeShifts, formatHours(employeeHours)]);
      });
      summaryRows.push(['סה״כ', overallShifts, formatHours(overallHours)]);

      const workbook = XLSX.utils.book_new();
      const detailsSheet = XLSX.utils.aoa_to_sheet(detailedRows);
      detailsSheet['!cols'] = [{ wch: 16 }, { wch: 13 }, { wch: 11 }, { wch: 13 }, { wch: 13 }, { wch: 12 }, { wch: 14 }];
      detailsSheet['!autofilter'] = { ref: `A1:G${detailedRows.length}` };
      detailsSheet['!freeze'] = { xSplit: 0, ySplit: 1 };
      XLSX.utils.book_append_sheet(workbook, detailsSheet, 'פירוט שעות');

      const summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
      summarySheet['!cols'] = [{ wch: 18 }, { wch: 16 }, { wch: 18 }];
      XLSX.utils.book_append_sheet(workbook, summarySheet, 'סיכום חודשי');

      XLSX.writeFile(workbook, `דוח_שעות_${MONTH_NAMES[month]}_${year}.xlsx`);
      showToast('קובץ ה־Excel מוכן להורדה');
    }

    buildTable();
  </script>
</body>
</html>
